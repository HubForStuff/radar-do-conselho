<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radar Brasil — Inteligência para brasileiros na China</title>

<meta name="description" content="Inteligência semanal para brasileiros na China.">
<meta name="theme-color" content="#009C3B">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f8efe2;
  --card:#fffdf9;
  --t1:#1a1a1a;
  --t2:#555;
  --t3:#999;
  --b:rgba(0,0,0,0.1);
  --green:#009C3B;
  --green-d:#085041;
  --blue:#0C447C;
  --r:8px;
  --rl:12px;
}

body{
  font-family:Roboto,sans-serif;
  background:var(--bg);
  color:var(--t1);
}

.page{max-width:1100px;margin:auto;padding:2rem}

/* HEADER */
.logo-name{
  font-family:'Playfair Display',serif;
  font-size:46px;
  font-weight:700;
  letter-spacing:-0.02em;
}

.logo-sub{font-size:13px;color:var(--t2)}

/* HERO */
.sub-hero{
  background:#d6f0e0;
  padding:1rem;
  border-radius:var(--rl);
  margin:1.5rem 0;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input{
  padding:10px;
  border:1px solid var(--b);
  border-radius:var(--r);
}

button{
  padding:10px 14px;
  border:none;
  background:var(--green);
  color:white;
  border-radius:var(--r);
  cursor:pointer;
}

/* NEWS */
.news-card{
  background:var(--card);
  border:1px solid var(--b);
  padding:1rem;
  border-radius:var(--rl);
  margin-bottom:12px;
  cursor:pointer;
}

.news-title{
  font-weight:600;
  margin-bottom:6px;
}

.news-meta{
  font-size:11px;
  color:var(--t3);
  margin-bottom:6px;
}

.news-summary{
  font-size:13px;
  color:var(--t2);
  line-height:1.6;
}

.news-link{
  font-size:12px;
  color:var(--blue);
  display:inline-block;
  margin-top:6px;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:3rem;
  color:var(--t3);
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:var(--green-d);
  color:white;
  padding:10px 18px;
  border-radius:30px;
  opacity:0;
  transition:.2s;
}
.toast.show{opacity:1}

</style>
</head>

<body>

<div class="page">

  <!-- HEADER -->
  <div>
    <div class="logo-name">Radar Brasil</div>
    <div class="logo-sub">Inteligência para brasileiros na China</div>
  </div>

  <!-- SUBSCRIBE -->
  <div class="sub-hero">
    <input id="name" placeholder="Nome">
    <input id="email" placeholder="Email">
    <button onclick="subscribe()">Inscrever</button>
  </div>

  <button onclick="fetchAllNews()">Atualizar notícias</button>

  <div id="news"></div>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================
   CATEGORIES (SEARCH ONLY)
========================= */

const CATEGORIES = [
  { queries: [
    'Conselho de Cidadãos Brasileiros China',
    'brasileiros China comunidade eventos'
  ]},
  { queries: [
    'visto China brasileiros requisitos',
    'imigração China Brasil visto'
  ]},
  { queries: [
    'Brasil China acordo comércio economia',
    'China investe Brasil parceria'
  ]}
];

let apiKey = localStorage.getItem('gnews_api_key') || '';
let cache = JSON.parse(localStorage.getItem('cache') || 'null');

/* =========================
   UTILS
========================= */

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function wordsLimit(text, limit=58){
  return text.split(/\s+/).slice(0,limit).join(' ') + '...';
}

/* LIGHT PT TRANSFORM */
function toPT(t){
  if(!t) return '';
  return t
    .replace(/China/g,'China')
    .replace(/Brazil/g,'Brasil')
    .replace(/government/g,'governo')
    .replace(/agreement/g,'acordo')
    .replace(/visa/g,'visto')
    .replace(/trade/g,'comércio')
    .replace(/economy/g,'economia');
}

/* =========================
   FETCH NEWS
========================= */

async function search(q){
  const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(q)}&lang=pt,en&max=3&apikey=${apiKey}`;
  const res = await fetch(url);
  if(!res.ok) return [];
  const data = await res.json();
  return data.articles || [];
}

async function fetchAllNews(){

  if(!apiKey){
    toast('Adicione API key no localStorage (gnews_api_key)');
    return;
  }

  document.getElementById('news').innerHTML = '<div class="empty">Carregando...</div>';

  const results = [];
  const seen = new Set();

  for(const cat of CATEGORIES){
    for(const q of cat.queries.slice(0,2)){

      const articles = await search(q);

      for(const a of articles){

        if(seen.has(a.url)) continue;
        seen.add(a.url);

        results.push({
          title: a.title,
          summary: toPT(a.description || a.title || ''),
          date: a.publishedAt,
          source: a.source?.name || '',
          url: a.url
        });

        if(results.length >= 25) break;
      }
    }
  }

  results.sort((a,b)=>new Date(b.date)-new Date(a.date));

  render(results);
}

/* =========================
   RENDER (UNIFIED FEED)
========================= */

function render(data){

  const el = document.getElementById('news');

  if(!data.length){
    el.innerHTML = '<div class="empty">Nenhuma notícia encontrada</div>';
    return;
  }

  el.innerHTML = data.map(n=>`
    <div class="news-card" onclick="window.open('${n.url}','_blank')">
      <div class="news-title">${n.title}</div>

      <div class="news-meta">
        ${n.source} • ${new Date(n.date).toLocaleDateString('pt-BR')}
      </div>

      <div class="news-summary">
        ${wordsLimit(n.summary,58)}
      </div>

      <div class="news-link">Ler notícia →</div>
    </div>
  `).join('');

  localStorage.setItem('cache', JSON.stringify({
    time: Date.now(),
    data
  }));
}

/* =========================
   INIT
========================= */

if(cache && Date.now()-cache.time < 1000*60*30){
  render(cache.data);
}

</script>

</body>
</html>
