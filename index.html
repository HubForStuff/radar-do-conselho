<script>

async function fetchAllNews(){

  document.getElementById("news").innerHTML =
    "<div class='empty'>Carregando...</div>";

  try {
    const res = await fetch("http://localhost:3000/news");
    const data = await res.json();
    render(data);
  } catch (e) {
    document.getElementById("news").innerHTML =
      "<div class='empty'>Erro ao carregar notícias</div>";
  }
}

function render(data){

  const el = document.getElementById("news");

  if(!data || !data.length){
    el.innerHTML = "<div class='empty'>Nenhuma notícia</div>";
    return;
  }

  el.innerHTML = data.map(n => `
    <div class="news-card" onclick="window.open('${n.url}','_blank')">

      <div class="news-title">${escapeHtml(n.title)}</div>

      <div class="news-meta">
        ${n.source} • ${new Date(n.date).toLocaleDateString('pt-BR')}
      </div>

      <div class="news-summary">
        ${trimWords(n.summary, 58)}
      </div>

      <div class="news-link">Ler notícia →</div>

    </div>
  `).join('');
}

function trimWords(text, limit=58){
  const w = (text||"").split(/\s+/);
  return w.length <= limit ? text : w.slice(0,limit).join(" ") + "...";
}

function escapeHtml(str){
  return (str||"").replace(/[&<>]/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;"
  }[m]));
}

</script>
