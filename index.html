    negative: ['war','military','missile','iran','israel']
  },

  scoreArticle(article) {
    const text = (article.title + ' ' + article.description).toLowerCase();
    let score = 0;

    if (!this.filters.mustHave.some(t => text.includes(t))) return -100;
    if (this.filters.relevanceSignals.some(t => text.includes(t))) score += 3;
    if (text.includes('beijing') || text.includes('pequim')) score += 4;
    if (text.includes('tianjin')) score += 3;

    this.filters.boost.forEach(t => { if (text.includes(t)) score += 2; });
    this.filters.negative.forEach(t => { if (text.includes(t)) score -= 5; });

    return score;
  },

  filterAndRank(articles) {
    return articles
      .map(a => ({ ...a, score: this.scoreArticle(a) }))
      .filter(a => a.score > 0)
      .sort((a,b) => b.score - a.score);
  }
